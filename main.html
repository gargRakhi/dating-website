<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Secret Code 💙✨</title>


  <style>

    /* =========================
       RESET
    ========================== */

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    /* =========================
       BODY
    ========================== */

    body {

      min-height: 100vh;

      overflow: hidden;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

      font-family: Arial, sans-serif;

      background:

        radial-gradient(

          circle at top left,

          #5c6bc0,

          transparent 40%

        ),

        radial-gradient(

          circle at bottom right,

          #7b1fa2,

          transparent 40%

        ),

        linear-gradient(

          135deg,

          #0f172a,

          #312e81,

          #581c87

        );

    }


    /* =========================
       FLOATING HEARTS
    ========================== */

    .hearts {

      position: fixed;

      inset: 0;

      pointer-events: none;

      overflow: hidden;

    }


    .heart {

      position: absolute;

      bottom: -60px;

      font-size: 28px;

      opacity: 0.8;

      animation:

        floatHeart

        linear

        infinite;

    }


    .heart:nth-child(1) {

      left: 10%;

      animation-duration: 8s;

      animation-delay: 0s;

    }


    .heart:nth-child(2) {

      left: 25%;

      animation-duration: 11s;

      animation-delay: 2s;

      font-size: 20px;

    }


    .heart:nth-child(3) {

      left: 45%;

      animation-duration: 9s;

      animation-delay: 1s;

      font-size: 35px;

    }


    .heart:nth-child(4) {

      left: 65%;

      animation-duration: 12s;

      animation-delay: 3s;

      font-size: 22px;

    }


    .heart:nth-child(5) {

      left: 85%;

      animation-duration: 10s;

      animation-delay: 1s;

      font-size: 32px;

    }


    @keyframes floatHeart {

      0% {

        transform:

          translateY(0)

          rotate(0deg)

          scale(1);

        opacity: 0;

      }


      20% {

        opacity: 0.9;

      }


      50% {

        transform:

          translateY(-50vh)

          rotate(180deg)

          scale(1.2);

      }


      100% {

        transform:

          translateY(-115vh)

          rotate(360deg)

          scale(0.8);

        opacity: 0;

      }

    }


    /* =========================
       CARD
    ========================== */

    .card {

      position: relative;

      z-index: 2;

      width: min(95%, 520px);

      min-height: 500px;

      padding: 55px 40px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      background:

        rgba(

          255,

          255,

          255,

          0.12

        );

      border: 1px solid

        rgba(

          255,

          255,

          255,

          0.25

        );

      border-radius: 35px;

      box-shadow:

        0 0 40px

        rgba(

          167,

          139,

          250,

          0.35

        ),

        inset 0 0 25px

        rgba(

          255,

          255,

          255,

          0.08

        );

      backdrop-filter: blur(18px);

    }


    /* =========================
       GLOWING HEART
    ========================== */

    .mainHeart {

      margin-bottom: 25px;

      font-size: 65px;

      filter:

        drop-shadow(

          0 0 15px

          #f0abfc

        );

      animation:

        heartbeat

        1.5s

        ease-in-out

        infinite;

    }


    @keyframes heartbeat {

      0%,

      100% {

        transform: scale(1);

      }


      50% {

        transform: scale(1.18);

      }

    }


    /* =========================
       HEADING
    ========================== */

    h1 {

      margin-bottom: 20px;

      color: white;

      font-size: clamp(

        28px,

        6vw,

        38px

      );

      text-shadow:

        0 0 12px

        rgba(

          255,

          255,

          255,

          0.5

        );

    }


    /* =========================
       TEXT
    ========================== */

    p {

      margin-bottom: 20px;

      color: #e9d5ff;

      font-size: 18px;

      line-height: 1.6;

    }


    .question {

      color: white;

      font-size: 22px;

      font-weight: bold;

    }


    /* =========================
       INPUT
    ========================== */

    input {

      width: 100%;

      max-width: 370px;

      padding: 16px 20px;

      color: white;

      background:

        rgba(

          255,

          255,

          255,

          0.12

        );

      border: 1px solid

        rgba(

          255,

          255,

          255,

          0.35

        );

      border-radius: 30px;

      outline: none;

      text-align: center;

      font-size: 16px;

      transition: 0.3s ease;

    }


    input::placeholder {

      color: #ddd6fe;

    }


    input:focus {

      border-color: #f0abfc;

      box-shadow:

        0 0 20px

        rgba(

          240,

          171,

          252,

          0.5

        );

    }


    /* =========================
       BUTTON
    ========================== */

    button {

      margin-top: 22px;

      padding: 14px 36px;

      color: white;

      background:

        linear-gradient(

          135deg,

          #ec4899,

          #8b5cf6

        );

      border: none;

      border-radius: 30px;

      font-size: 17px;

      cursor: pointer;

      box-shadow:

        0 0 20px

        rgba(

          236,

          72,

          153,

          0.5

        );

      transition: 0.3s ease;

    }


    button:hover {

      transform:

        scale(1.08)

        translateY(-3px);

      box-shadow:

        0 0 30px

        rgba(

          236,

          72,

          153,

          0.8

        );

    }


    /* =========================
       MESSAGE
    ========================== */

    #message {

      min-height: 25px;

      margin-top: 22px;

      color: #f9a8d4;

      font-size: 15px;

    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 480px) {

      .card {

        width: 100%;

        min-height: 480px;

        padding: 45px 22px;

      }


      .mainHeart {

        font-size: 55px;

      }


      h1 {

        font-size: 29px;

      }


      p {

        font-size: 16px;

      }


      .question {

        font-size: 19px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       FLOATING HEARTS
  ========================== -->

  <div class="hearts">

    <span class="heart">💙</span>

    <span class="heart">💜</span>

    <span class="heart">💙</span>

    <span class="heart">💜</span>

    <span class="heart">💙</span>

  </div>


  <!-- =========================
       MAIN CARD
  ========================== -->

  <div class="card">


    <div class="mainHeart">

      💙

    </div>


    <h1>

      A Little Secret ✨

    </h1>


    <p>

      Is website par visit karne ke liye

      pehle secret code enter karo 😌

    </p>


    <p class="question">

      Code hai:

      <br />

      "Main aapka kya hoon baby?" 😏💙

    </p>


    <input

      type="text"

      id="answer"

      placeholder="Answer likho 💭"

    />


    <button

      id="submitBtn"

    >

      Unlock My Heart 💙

    </button>


    <div id="message"></div>


  </div>


  <script>


    const submitBtn =

      document.getElementById(

        "submitBtn"

      );


    const answerInput =

      document.getElementById(

        "answer"

      );


    const message =

      document.getElementById(

        "message"

      );


    submitBtn.addEventListener(

      "click",

      () => {


        const answer =

          answerInput.value

            .toLowerCase()

            .trim();


        if (

          answer === "bacha" ||

          answer === "baby" ||

          answer ===

          "wife"

        ) {


          window.location.href =

            "/visit";


        }

        else {


          message.innerText =

            "Hmm... wrong answer 😏💙 Try again!";

        }

      }

    );


    answerInput.addEventListener(

      "keypress",

      (event) => {


        if (

          event.key === "Enter"

        ) {

          submitBtn.click();

        }

      }

    );


  </script>


</body>

</html>
