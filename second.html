<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Oh Really? 😭💖</title>


  <style>

    /* =========================
       RESET
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       PAGE
    ========================== */

    body {
      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

      background: linear-gradient(
        135deg,
        #ffd6e7,
        #fff0f6
      );

      font-family: Arial, sans-serif;
    }


    /* =========================
       SECOND CARD
    ========================== */

    .secondCard {
      width: min(94%, 500px);

      min-height: 500px;

      padding: 45px 35px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      background-color: white;

      border-radius: 30px;

      box-shadow:
        0 10px 35px
        rgba(0, 0, 0, 0.15);
    }


    /* =========================
       PARTY IMAGE
    ========================== */

    .partyImage {
      width: 170px;

      height: 170px;

      object-fit: contain;

      margin-bottom: 25px;
    }


    /* =========================
       HEADING
    ========================== */

    .secondCard h2 {
      margin-bottom: 15px;

      color: #ff4f81;

      font-size: 28px;

      line-height: 1.3;
    }


    /* =========================
       TEXT
    ========================== */

    .secondCard p {
      margin-bottom: 8px;

      color: #555;

      font-size: 16px;
    }


    /* =========================
       OKAY BUTTON
    ========================== */

    #okayBtn {
      margin-top: 25px;

      padding: 13px 32px;

      border: none;

      border-radius: 30px;

      color: white;

      background-color: #ff4f81;

      font-size: 18px;

      cursor: pointer;

      transition: 0.2s ease;
    }


    #okayBtn:hover {
      transform: scale(1.08);

      background-color: #ff2f6b;
    }


    /* =========================
       LAST TEXT
    ========================== */

    .lastText {
      margin-top: 30px;

      color: #ff4f81 !important;

      font-size: 17px !important;

      font-weight: bold;
    }


    /* =========================
       RESPONSIVE DESIGN
    ========================== */

    @media (max-width: 480px) {

      .secondCard {
        width: 100%;

        min-height: 480px;

        padding: 35px 20px;
      }


      .partyImage {
        width: 140px;

        height: 140px;
      }


      .secondCard h2 {
        font-size: 24px;
      }


      .secondCard p {
        font-size: 15px;
      }
    }

  </style>

</head>


<body>


  <!-- =========================
       SECOND CARD
  ========================== -->

  <div class="secondCard">


    <!-- Party Image -->

    <img
      class="partyImage"

      src="party.jpg"

      alt="Party Popper"
    />


    <!-- Main Text -->

    <h2>
      What You actually said YES?? 😭💖
    </h2>


    <!-- Small Text -->

    <p>
      I was so ready for you to say NO 😂
    </p>


    <!-- Okay Button -->

  <a href="/okay"> <button id="okayBtn">
      Okay 😌
    </button>
    </a> 


    <!-- Last Text -->

    <p class="lastText">
      Aapka mann hai toh theek hai 😌😂
    </p>


  </div>


</body>

</html>
